unit: warranty-reminders
bindings:
  - type: listener
    name: "@Scheduled(cron = \"${app.warranty.reminder-cron:0 0 9 * * ?}\")"
    source_loc: backend/src/main/java/com/warrantrack/service/WarrantyReminderScheduler.java:31
    target: WarrantyReminderScheduler
    must_appear_in_target: true
    notes: Spring scheduled job at configurable cron; default daily at 09:00.
